# Linux-only override for account-scoped IPv6 egress.
#
# Usage:
#   docker compose -f docker-compose.local.yml -f docker-compose.ipv6-egress.yml up -d
#
# The Docker network uses a ULA only as the container next hop. The globally
# routed pool is routed by the host to IPV6_EGRESS_CONTAINER_IP; pool addresses
# are never created as Docker proxy records or assigned to the main container.

services:
  sub2api:
    environment:
      # IPv6 is enabled from Admin -> IPv6 Egress. These legacy variables are
      # optional compatibility overrides; no secret or enable switch is
      # required in the deployment environment anymore.
      - IPV6_EGRESS_ENABLED=${IPV6_EGRESS_ENABLED:-false}
      - IPV6_EGRESS_ALLOCATION_SECRET=${IPV6_EGRESS_ALLOCATION_SECRET:-}
      - IPV6_EGRESS_FREEBIND=${IPV6_EGRESS_FREEBIND:-true}
      - IPV6_EGRESS_RECONCILE_INTERVAL_SECONDS=${IPV6_EGRESS_RECONCILE_INTERVAL_SECONDS:-60}
      - IPV6_EGRESS_PROBE_URL=${IPV6_EGRESS_PROBE_URL:-https://api64.ipify.org}
      - IPV6_EGRESS_PROBE_TIMEOUT_SECONDS=${IPV6_EGRESS_PROBE_TIMEOUT_SECONDS:-10}
    networks:
      sub2api-network:
        ipv6_address: ${IPV6_EGRESS_CONTAINER_IP:-fd42:5355:4232::10}
    # Deliberately no NET_ADMIN. Source binding is per socket through
    # IPV6_FREEBIND; host routing is prepared separately.

networks:
  sub2api-network:
    name: ${IPV6_EGRESS_DOCKER_NETWORK:-sub2api-ipv6-egress}
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv6: routed
    ipam:
      config:
        - subnet: ${IPV6_EGRESS_DOCKER_SUBNET:-fd42:5355:4232::/64}
          gateway: ${IPV6_EGRESS_DOCKER_GATEWAY:-fd42:5355:4232::1}
