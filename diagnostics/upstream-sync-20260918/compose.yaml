services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: sync_test_password
      POSTGRES_DB: sub2api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    image: sub2api-upstream-sync-20260918:candidate
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: debug
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: sync_test_password
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_EMAIL: admin@sub2api.local
      ADMIN_PASSWORD: sync_admin_password
      JWT_SECRET: sync_test_jwt_secret_abcdefghijklmnopqrstuvwxyz_0123456789
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,postgres,redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
